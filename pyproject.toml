[project]
name = "persian-meeting-backend"
version = "0.1.0"
description = "Persian meeting audio processing backend"
requires-python = ">=3.11,<3.12"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "minio>=7.2.20",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings",
    "pyjwt>=2.13.0",
    "python-multipart",
    "sqlalchemy[asyncio]>=2.0.51",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.21,<0.22",
    "httpx>=0.28",
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
]

[tool.uv]
package = false
