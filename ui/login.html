<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102a2a"><title>ورود | هم‌نشین</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/pages.css"></head><body>
<div class="ambient ambient-one"></div><div class="ambient ambient-two"></div><main class="auth-shell">
<section class="auth-story"><div class="brand-mark">هـ</div><p class="eyebrow">سامانه هوشمند جلسات</p><h1>هر گفتگو،<br><span>روشن و ماندگار.</span></h1><p class="lead">جلسه‌ها، اعضا و فایل‌های صوتی را در یک فضای آرام و منظم مدیریت کنید.</p><div class="story-card"><div class="sound-wave"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><div><strong>آماده برای شنیدن</strong><small>پردازش صوت در فاز بعدی فعال می‌شود</small></div></div></section>
<section class="auth-card"><div class="auth-tabs"><a class="tab active" href="/login.html">ورود</a><a class="tab" href="/register.html">ساخت حساب</a></div><form id="auth-form" class="auth-form" data-mode="login"><div class="form-heading"><h2>خوش برگشتی</h2><p>برای ادامه وارد حساب خود شوید.</p></div><label>ایمیل<input name="email" type="email" autocomplete="email" required placeholder="name@example.com"></label><label>رمز عبور<input name="password" type="password" autocomplete="current-password" required placeholder="رمز عبور"></label><button class="button primary wide" type="submit">ورود به سامانه</button></form><p id="auth-error" class="form-error" role="alert"></p></section>
</main><script type="module" src="/js/auth-page.js"></script></body></html>
