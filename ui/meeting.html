<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102a2a"><title>جزئیات جلسه | هم‌نشین</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/pages.css"></head><body>
<div class="app-shell"><aside class="sidebar" data-sidebar></aside><section class="workspace"><header class="topbar"><button data-mobile-menu class="icon-button mobile-only">☰</button><div><p class="eyebrow">فضای گفتگو</p><h2>جزئیات جلسه</h2></div></header>
<main><a href="/meetings.html" class="text-button back-button">→ بازگشت به جلسه‌ها</a><div class="detail-hero"><div><span class="status-pill">جلسه فعال</span><h2 id="detail-title">در حال بارگذاری…</h2><p id="detail-description"></p></div><div class="detail-actions"><button id="edit-meeting" class="button secondary">ویرایش</button><button id="delete-meeting" class="button danger">حذف</button></div></div><div class="detail-columns"><article class="panel"><div class="panel-heading"><div><h3>فایل‌های صوتی</h3><p>آپلود و شروع خودکار پردازش</p></div><label class="button secondary upload-button">＋ آپلود<input id="voice-input" type="file" accept="audio/*" hidden></label></div><div id="upload-progress" class="upload-progress hidden"><span></span><p>در حال آپلود فایل…</p></div><div id="voice-list" class="stack-list"></div></article><article class="panel"><div class="panel-heading"><div><h3>اعضای جلسه</h3><p>افزودن فقط از میان کاربران موجود.</p></div></div><form id="add-member-form" class="inline-form"><input name="email" type="email" required placeholder="ایمیل کاربر"><select name="role"><option value="viewer">مشاهده‌گر</option><option value="contributor">همکار</option></select><button class="button compact" type="submit">افزودن</button></form><div id="member-list" class="stack-list"></div></article></div></main></section></div>
<dialog id="meeting-modal" class="modal"><form id="meeting-form"><div class="modal-heading"><div><p class="eyebrow">ویرایش</p><h2>اطلاعات جلسه</h2></div><button type="button" class="icon-button" data-close-modal>×</button></div><label>عنوان جلسه<input name="title" required maxlength="255"></label><label>توضیحات<textarea name="description" rows="4"></textarea></label><label>زمان جلسه<input name="date" type="datetime-local"></label><div class="modal-actions"><button type="button" class="button secondary" data-close-modal>انصراف</button><button type="submit" class="button primary">ذخیره تغییرات</button></div></form></dialog><div id="toast" class="toast" role="status"></div><script type="module" src="/js/meeting-page.js"></script></body></html>
