<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102a2a"><title>ساخت حساب | هم‌نشین</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/pages.css"></head><body>
<div class="ambient ambient-one"></div><div class="ambient ambient-two"></div><main class="auth-shell">
<section class="auth-story"><div class="brand-mark">هـ</div><p class="eyebrow">یک فضای تازه</p><h1>جلسه‌ها را<br><span>کنار هم نگه دار.</span></h1><p class="lead">بعد از ساخت حساب، بدون ورود دوباره مستقیماً به فضای جلسه‌ها می‌روید.</p><div class="story-card"><div class="sound-wave"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><div><strong>ساده و یکپارچه</strong><small>حساب شما بلافاصله فعال می‌شود</small></div></div></section>
<section class="auth-card"><div class="auth-tabs"><a class="tab" href="/login.html">ورود</a><a class="tab active" href="/register.html">ساخت حساب</a></div><form id="auth-form" class="auth-form" data-mode="register"><div class="form-heading"><h2>شروع یک فضای تازه</h2><p>اطلاعات پایه حساب خود را وارد کنید.</p></div><label>نام نمایشی<input name="full_name" autocomplete="name" placeholder="نام و نام خانوادگی"></label><label>ایمیل<input name="email" type="email" autocomplete="email" required placeholder="name@example.com"></label><label>رمز عبور<input name="password" type="password" autocomplete="new-password" minlength="8" required placeholder="حداقل ۸ کاراکتر"></label><button class="button primary wide" type="submit">ساخت حساب</button></form><p id="auth-error" class="form-error" role="alert"></p></section>
</main><script type="module" src="/js/auth-page.js"></script></body></html>
