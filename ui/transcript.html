<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1118">
  <title>متن جلسه | هم‌نشین</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/pages.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" data-sidebar></aside><button class="sidebar-overlay" data-sidebar-overlay aria-label="بستن منو"></button>
    <section class="workspace">
      <header class="topbar compact-topbar"><button data-mobile-menu class="icon-button mobile-only" aria-label="باز کردن منو" aria-expanded="false"><svg class="icon"><use href="#i-menu"/></svg></button><div class="page-title"><p class="eyebrow">TRANSCRIPT / خروجی صوت</p><h1>متن کامل فایل</h1></div></header>
      <main class="view-section transcript-workspace">
        <a href="javascript:history.back()" class="text-button back-button"><svg class="icon"><use href="#i-arrow-forward"/></svg> بازگشت</a>
        <article class="panel transcript-page-panel">
          <header class="transcript-header"><div><p class="section-index">DOCUMENT / 01</p><h2 id="transcript-title">متن تبدیل‌شده</h2><p id="transcript-meta" class="muted"></p></div><span id="transcript-language" class="status-pill"></span></header>
          <section id="processing-error" class="processing-error hidden" role="alert"><strong id="processing-error-title"></strong><code id="processing-error-code"></code><p id="processing-error-message"></p></section>
          <div class="transcript-ruler" aria-hidden="true"><span>00:00</span><i></i><i></i><i></i><i></i><i></i><i></i><span>END</span></div>
          <div id="transcript-content" class="transcript-full" aria-live="polite">در حال بارگذاری متن…</div>
        </article>
      </main>
    </section>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div><script type="module" src="/js/transcript-page.js"></script>
</body>
</html>
